# Two TES stacks support opposite ends of a 20 mm wide, 1 mm deep absorber.
# Dimensions and material properties follow the existing single-pixel model.
model_version = 3

[parameters]
abs_dx = "1[mm]"
abs_dy = "abs_dx"
abs_dz = "0.7[mm]"
Si_2_dz = "350[um]"
Si_dx = "3[mm]"
Si_dy = "6[mm]"
membrane_dz = "10[um]"
membrane_dx = "700[um]"
membrane_dy = "membrane_dx"
TES_Ti_dx = "500[um]"
TES_Ti_dy = "TES_Ti_dx"
TES_Ti_dz = "0.04[um]"
TES_Au_dx = "TES_Ti_dx"
TES_Au_dy = "TES_Ti_dx"
TES_Au_dz = "0.12[um]"
Stycast_dx = "400[um]"
Stycast_dy = "Stycast_dx"
Stycast_dz = "20[um]"
R_n = "125[mohm]"
T_c = "0.1709[K]"
dW = "0.001"
R_min = "1e-6[ohm]"
T_bath = "150[mK]"
SiO2_1_dz = "1[um]"
SiNx_dz = "1[um]"
TES_dz = "TES_Au_dz+TES_Ti_dz"
SiO2_2_dz = "2[um]"
Si_1_dz = "15[um]"
G0 = "7.854e-6[W/K]"
T_0 = "168.57[mK]"
TES_volume = "TES_Au_dx*TES_Au_dy*TES_dz"
dabs_dx = "20[mm]"
tes_pitch = "19[mm]"

[materials.Pb]
k = "1.68e-2"
rho = "9860"
cp = "3.26e-05"

[materials.Stycast]
k = "2.69094e-06"
rho = "2400"
cp = "1.22e-3"

[materials.TES]
k = "68"
rho = "15695"
cp = "1.25e-3"

[materials.Si]
k = "3.7e-1"
rho = "2332"
cp = "1.24e-06"

[materials.SiO2]
k = "4.94e-4"
rho = "2200"
cp = "1.24e-4"

[materials.SiNx]
k = "1.02e-4"
rho = "3400"
cp = "2.43e-5"

[materials.Membrane]
k = "G0*T**(4.252-1)*0.4*(membrane_dx-TES_Au_dx)/(8*(SiNx_dz+Si_1_dz+SiO2_1_dz)*TES_Au_dx)"
rho = "2387"
cp = "9.82e-6"

# One TES stack at either end of the 20 mm absorber.
[[components.end_stacks.tes]]
id = "left"
position = ["-9.5[mm]", "0[mm]"]

[[components.end_stacks.tes]]
id = "right"
position = ["9.5[mm]", "0[mm]"]

[layout]
absorber_length = "20[mm]"
absorber_width = "1[mm]"

[[layout.groups]]
id = "ends"
component = "end_stacks"
origin = ["0[mm]", "0[mm]"]
tes_ids = { left = "tes_left", right = "tes_right" }

# Initial mesh sizing follows the established single-pixel workflow.
[mesh]
global_size = "100[um]"
tes_local_size = "8[um]"
absorber_local_size = "50[um]"
absorber_local_radius = "75[um]"
stycast_layers = 4
si_1_layers = 4
sio2_1_layers = 1
sinx_layers = 1

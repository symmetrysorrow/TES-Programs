# Single-pixel TES, full-conformal prism mesh (h = 8 um), pulse at the absorber centre.
#   python src/tes_sim.py run projects/legacy/cases/single_pixel_h8.toml
name = "single_pixel_h8"
mesh = "mesh_hybrid_fullconf_h8"
mpi = 6
preset = "fast"            # WSL CPU Release route; 75 ms timing is host-dependent

[transient]
window = "75ms_bdf2h15"

[transient.pulse]
energy = "1332[keV]"
center = "auto"            # absorber (pulse bodies) centroid

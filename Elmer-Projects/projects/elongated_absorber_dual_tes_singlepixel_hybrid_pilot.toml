# Elongated absorber: center temporal-resolution pilot using the single-pixel hybrid time grid through 1.48 ms after pulse.
schema_version = 3
name = "elongated_absorber_dual_tes"
model = "models/elongated_absorber_dual_tes.toml"
window = "singlepixel_hybrid_1p48ms"
steady_state_min_iterations = 30
steady_state_max_iterations = 30

[solver]
linear_system = "iterative_hypre_flexgmres_boomeramg"
linear_system_max_iterations = 3000
linear_system_convergence_tolerance = 1e-8
phase24_vector_assembly = true
phase24_wall_profiling = true
phase24_static_matrix_reuse = true
phase24_operator_lagging = "disabled"
phase24_operator_lag_threshold = 1e-4
phase24_operator_lag_max_reuse = 3
phase24_operator_lag_residual_growth = 1.25
phase24_preconditioner_lagging = "adaptive"
phase24_preconditioner_lag_threshold = 1e-4
phase24_preconditioner_lag_max_age = 1000
phase24_preconditioner_lag_krylov_relative_growth = 0.5
phase24_preconditioner_lag_nonlinear_threshold = 1e-3
phase24_hypre_reuse = true
steady_extra_solver_keywords = [
  "TES Inner Circuit Newton = Logical True",
]
extra_solver_keywords = [
  "TES Inner Circuit Newton = Logical True",
  "TES Inner Circuit Predict From Temperature = Logical True",
  "TES Inner Circuit Newton Slope Reuse = Logical True",
  "TES Inner Circuit Power Residual Tolerance = Real 1e-6",
  "Phase24 BDF1 Step Start Times(2) = Real 0.02002 0.020020001",
]

[circuits.tes_left]
I_bias = "715[uA]"
R_sh = "3.9[mohm]"
L_tes = "12.3[nH]"
R_0 = "15.527[mohm]"
alpha = 256.46
beta = 5.03

[circuits.tes_right]
I_bias = "715[uA]"
R_sh = "3.9[mohm]"
L_tes = "12.3[nH]"
R_0 = "15.527[mohm]"
alpha = 256.46
beta = 5.03

[pulse]
energy = "1332[keV]"
start = "20.02[ms]"
duration = "1[ns]"
sigma = "50[um]"
center = "auto"

# Elongated absorber with an independently biased TES stack at each end.
schema_version = 3
name = "elongated_absorber_dual_tes"
model = "models/elongated_absorber_dual_tes.toml"
window = "75ms_bdf2h15"

[solver]
linear_system = "iterative_hypre_pcg_boomeramg"
linear_system_convergence_tolerance = 1e-11

[circuits.tes_left]
I_bias = "715[uA]"
R_sh = "3.9[mohm]"
L_tes = "12.3[nH]"
R_0 = "15.527[mohm]"
alpha = 256.46
beta = 5.03

[circuits.tes_right]
I_bias = "715[uA]"
R_sh = "3.9[mohm]"
L_tes = "12.3[nH]"
R_0 = "15.527[mohm]"
alpha = 256.46
beta = 5.03

[pulse]
energy = "1332[keV]"
start = "20.02[ms]"
duration = "1[ns]"
sigma = "50[um]"
center = "auto"

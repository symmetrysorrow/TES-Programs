# Single-pixel TES, full-conformal prism mesh (h = 8 um), pulse at the absorber centre.
#   python tes_sim.py run cases/single_pixel_h8.toml
name = "single_pixel_h8"
mesh = "mesh_hybrid_fullconf_h8"
mpi = 6
preset = "fast"            # validated fast route (75 ms in ~5 min); "accurate" = tight tolerances

[transient]
window = "75ms_bdf2h15"

[transient.pulse]
energy = "1332[keV]"
center = "auto"            # absorber (pulse bodies) centroid

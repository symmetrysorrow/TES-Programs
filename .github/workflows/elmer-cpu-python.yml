name: Elmer CPU Python checks

on:
  pull_request:
    paths:
      - "Elmer-Projects/**"
      - ".github/workflows/elmer-cpu-python.yml"
  push:
    branches: [main]
    paths:
      - "Elmer-Projects/**"
      - ".github/workflows/elmer-cpu-python.yml"

jobs:
  python-contracts:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Elmer-Projects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies and required graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libgl1
          python -m pip install -r requirements-cpu.txt
      - name: Validate CPU bootstrap shell syntax
        run: |
          bash -n src/support/setup_cpu_ubuntu.sh
          bash -n src/support/prepare_elmergpu_sources.sh
      - name: Run fast CPU/mesh configuration tests
        env:
          PYTHONPATH: ".:src"
        run: |
          python -m pytest -q tests/test_generated_mesh_bootstrap.py tests/test_elmer_wsl_backend.py tests/test_scenario_config.py tests/test_main_cli.py

[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "tes-cpp-dump2event"
version = "0.1.0"
description = "Fast, portable conversion from PHITS dumpall.dat to event.json"
requires-python = ">=3.9"

[tool.scikit-build]
wheel.packages = ["python/tes_cpp_dump2event"]
cmake.version = ">=3.20"
